server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx patch version to every visitor.
    server_tokens off;

    # The bundle loads nothing cross-origin: fonts are self-hosted, NCBI and
    # ESEfinder are plain links rather than fetches, and the API is same-origin.
    # style-src needs 'unsafe-inline' because the React views set a handful of
    # inline style attributes; there is no inline <script> anywhere.
    set $leaper_csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'";

    # nginx drops every inherited add_header as soon as a location declares one
    # of its own, so each location below that sets Cache-Control repeats this
    # block. Keep the two in sync.
    add_header Content-Security-Policy $leaper_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # Browsers ignore this header over plain HTTP, so it stays inert until the
    # instance is served over HTTPS and then takes effect without a config change.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The first load was shipping ~819 KB uncompressed, of which 404 KB is the
    # application bundle. Text assets compress by roughly four to one.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Vite fingerprints these filenames, so a changed file always arrives under a
    # new URL and the old one can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html carries the current asset names, so it must never be cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $leaper_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://backend:8080/health;
    }

    location /docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # The application serves its schema at /api/v1/openapi; this keeps the
    # conventional /openapi.json path working for clients that assume it.
    location = /openapi.json {
        proxy_pass http://backend:8080/api/v1/openapi;
        proxy_set_header Host $host;
    }

    # Crawler endpoints must return the real files from dist/, not be swallowed
    # by the SPA fallback below (which would answer every path with HTML). The
    # MIME type is pinned explicitly so crawlers get text/plain and
    # application/xml, never text/html.
    location = /robots.txt {
        types { text/plain txt; }
        default_type text/plain;
    }

    location = /sitemap.xml {
        types { application/xml xml; }
        default_type application/xml;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
