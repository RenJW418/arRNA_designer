server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The first load was shipping ~819 KB uncompressed, of which 404 KB is the
    # application bundle. Text assets compress by roughly four to one.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Vite fingerprints these filenames, so a changed file always arrives under a
    # new URL and the old one can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html carries the current asset names, so it must never be cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://backend:8080/health;
    }

    location /docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # The application serves its schema at /api/v1/openapi; this keeps the
    # conventional /openapi.json path working for clients that assume it.
    location = /openapi.json {
        proxy_pass http://backend:8080/api/v1/openapi;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
