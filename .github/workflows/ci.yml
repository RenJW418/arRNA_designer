name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint with ruff
        working-directory: backend
        run: ruff check .
      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build
      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  dom-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install jsdom externally
        run: npm install --prefix /tmp/leaper-dom-deps --no-package-lock --no-audit --no-fund jsdom@26.1.0
      - name: Run DOM regression (retry up to 3x for known flake)
        env:
          LEAPER_DOM_TEST_DEPS: /tmp/leaper-dom-deps
        run: |
          for attempt in 1 2 3; do
            echo "--- DOM regression attempt ${attempt} ---"
            if node --test --test-reporter=spec scripts/sequence_redesign_dom_smoke.mjs; then
              echo "DOM regression passed on attempt ${attempt}"
              exit 0
            fi
            echo "DOM regression attempt ${attempt} failed"
          done
          echo "DOM regression failed after 3 attempts"
          exit 1
